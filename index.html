<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>DorukCall</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%237c3aed'/%3E%3Cpath d='M17 22h30v20H29l-9 7v-7h-3z' fill='white'/%3E%3Ccircle cx='27' cy='32' r='2.5'/%3E%3Ccircle cx='32' cy='32' r='2.5'/%3E%3Ccircle cx='37' cy='32' r='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app-shell">
  <section id="authView" class="auth-view">
    <div class="auth-art">
      <div class="brand-lockup">
        <div class="logo-mark" aria-hidden="true"><span></span><i></i><i></i><i></i></div>
        <div>
          <div class="brand-name">DorukCall</div>
          <div class="brand-tag">Connect clearly.</div>
        </div>
      </div>
      <div class="auth-copy">
        <div class="eyebrow">PRIVATE • REALTIME • YOURS</div>
        <h1>Conversations that feel present.</h1>
        <p>Message, react, pin, and call from one modern communication space.</p>
      </div>
    </div>
    <div class="auth-card-wrap">
      <form id="authForm" class="auth-card">
        <div class="auth-head">
          <div class="logo-mark compact"><span></span><i></i><i></i><i></i></div>
          <div>
            <div class="brand-name">DorukCall</div>
            <div id="authModeLabel" class="muted">Hesabına giriş yap</div>
          </div>
        </div>

        <div id="nameField" class="field hidden">
          <label for="nameInput">Ad Soyad</label>
          <input id="nameInput" type="text" autocomplete="name" minlength="2">
        </div>
        <div class="field">
          <label for="emailInput">E-posta</label>
          <input id="emailInput" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="passwordInput">Şifre</label>
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="8" required>
        </div>

        <button id="authSubmit" class="primary-btn" type="submit">Giriş yap</button>
        <button id="forgotBtn" class="link-btn" type="button">Şifremi unuttum</button>

        <div class="auth-divider"><span>veya</span></div>
        <button id="switchAuth" class="ghost-btn" type="button">Yeni hesap oluştur</button>
        <div id="authError" class="form-error" role="alert"></div>
      </form>
    </div>
  </section>

  <section id="mainView" class="main-view hidden">
    <aside class="sidebar">
      <header class="sidebar-top">
        <div class="mini-brand">
          <div class="logo-mark tiny"><span></span><i></i><i></i><i></i></div>
          <strong>DorukCall</strong>
        </div>
        <div class="top-actions">
          <button id="newChatBtn" class="icon-btn" title="Yeni sohbet" aria-label="Yeni sohbet">＋</button>
          <button id="newGroupBtn" class="icon-btn" title="Yeni grup" aria-label="Yeni grup">⌘</button>
          <button id="notificationBtn" class="icon-btn notif-btn" title="Bildirimler" aria-label="Bildirimler">◔<span id="notifBadge" class="badge-dot hidden">0</span></button>
          <button id="settingsBtn" class="icon-btn" title="Ayarlar" aria-label="Ayarlar">⚙</button>
        </div>
      </header>

      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Sohbet, grup veya kullanıcı ara…">
      </div>

      <div class="sidebar-tabs">
        <button class="tab-btn active" data-filter="all">Tümü</button>
        <button class="tab-btn" data-filter="unread">Okunmamış</button>
      </div>

      <div id="conversationList" class="conversation-list"></div>

      <button id="profileStrip" class="profile-strip">
        <img id="meAvatar" class="avatar" alt="">
        <span class="presence-dot online"></span>
        <span class="profile-meta">
          <strong id="meName">—</strong>
          <small>Profil ve ayarlar</small>
        </span>
        <span class="chev">›</span>
      </button>
    </aside>

    <main class="chat-panel">
      <div id="emptyChat" class="empty-chat">
        <div class="empty-visual"><div class="logo-mark huge"><span></span><i></i><i></i><i></i></div></div>
        <h2>DorukCall</h2>
        <p>Bir sohbet seç veya yeni bir konuşma başlat.</p>
      </div>

      <section id="conversationView" class="conversation-view hidden">
        <header class="chat-head">
          <div class="chat-title-wrap">
            <button id="mobileBackBtn" class="icon-btn mobile-only" aria-label="Geri">‹</button>
            <img id="chatAvatar" class="avatar large" alt="">
            <div>
              <strong id="chatTitle">—</strong>
              <small id="chatStatus" class="muted">—</small>
            </div>
          </div>
          <div class="chat-actions">
            <button id="audioCallBtn" class="icon-btn call" title="Sesli arama">☎</button>
            <button id="videoCallBtn" class="icon-btn video" title="Görüntülü arama">▣</button>
            <button id="pinnedBtn" class="icon-btn" title="Sabitlenenler">⌖</button>
            <button id="chatInfoBtn" class="icon-btn" title="Bilgi">ⓘ</button>
          </div>
        </header>

        <div id="pinnedBar" class="pinned-bar hidden"></div>
        <div id="messageList" class="message-list"></div>

        <div id="replyBar" class="reply-bar hidden">
          <div><small>Yanıtlanıyor</small><strong id="replyPreview"></strong></div>
          <button id="cancelReplyBtn" class="icon-btn">×</button>
        </div>

        <form id="messageForm" class="composer">
          <button id="emojiBtn" class="icon-btn" type="button" title="Emoji">☺</button>
          <textarea id="messageInput" rows="1" placeholder="Mesaj yaz…" maxlength="4000"></textarea>
          <button class="send-btn" type="submit" aria-label="Gönder">➤</button>
          <div id="emojiPicker" class="emoji-picker hidden"></div>
        </form>
      </section>
    </main>
  </section>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<div id="incomingCallRoot"></div>
<div id="callOverlayRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
