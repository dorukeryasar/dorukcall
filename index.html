<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DorukCall</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #00a884;
      --primary-dark: #008f72;
      --bg: #efeae2;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667781;
      --border: #e1e6e8;
      --message-me: #d9fdd3;
      --message-you: #ffffff;
      --sidebar: #ffffff;
      --danger: #e53935;
      --shadow: 0 10px 40px rgba(0,0,0,.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20px 20px, rgba(0,0,0,.035) 2px, transparent 2px) 0 0/40px 40px,
        #dfe5e7;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 10% 20%, rgba(0,168,132,.25), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(0,100,90,.25), transparent 35%),
        linear-gradient(135deg, #081c15, #0e3126);
    }

    .auth-card {
      width: min(430px, 100%);
      background: rgba(255,255,255,.97);
      border-radius: 28px;
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
      padding: 34px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      margin: auto;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #00d2a0, #007a65);
      color: white;
      font-size: 38px;
      font-weight: 800;
      box-shadow: 0 15px 30px rgba(0,168,132,.3);
    }

    .brand h1 {
      margin-top: 14px;
      font-size: 30px;
    }

    .brand p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-tabs {
      display: flex;
      background: #eef2f3;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 22px;
    }

    .auth-tabs button {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      background: transparent;
      color: #607078;
      font-weight: 700;
    }

    .auth-tabs button.active {
      background: white;
      color: var(--primary-dark);
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .input {
      width: 100%;
      border: 1px solid #d6dde0;
      padding: 14px 15px;
      border-radius: 13px;
      outline: none;
      margin-bottom: 12px;
      background: #fbfcfc;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,168,132,.12);
    }

    #usernameInput {
      display: none;
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      background: linear-gradient(135deg, #00b88f, #00876e);
      color: white;
      font-weight: 800;
      margin-top: 4px;
      box-shadow: 0 10px 22px rgba(0,168,132,.22);
    }

    .auth-btn:hover {
      filter: brightness(1.05);
    }

    .auth-msg {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
    }

    /* APP */

    #appScreen {
      height: 100vh;
      display: flex;
      background: #dfe5e7;
    }

    #sidebar {
      width: 360px;
      min-width: 300px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      background: #f0f2f5;
      padding: 12px 15px;
    }

    .my-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 11px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #00b894, #007d68);
      color: white;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      flex: 1;
      font-weight: 700;
    }

    .top-icon {
      width: 40px;
      height: 40px;
      background: transparent;
      border-radius: 50%;
      font-size: 20px;
      color: #54656f;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 11px;
      padding: 0 12px;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      height: 40px;
      border: 0;
      outline: 0;
    }

    #userList {
      flex: 1;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      gap: 12px;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f1f2;
      align-items: center;
      transition: .15s;
    }

    .user-item:hover {
      background: #f5f7f8;
    }

    .user-item.active {
      background: #e9edef;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT */

    #chatArea {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #efeae2;
    }

    #welcome {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 40px;
      background:
        radial-gradient(circle at 20px 20px, rgba(84,88,91,.08) 2px, transparent 2px) 0 0/40px 40px,
        #efeae2;
    }

    .welcome-icon {
      font-size: 70px;
      margin-bottom: 15px;
    }

    #chatHeader {
      height: 64px;
      background: #f0f2f5;
      border-bottom: 1px solid #d8dde0;
      display: none;
      align-items: center;
      gap: 11px;
      padding: 8px 14px;
      z-index: 5;
    }

    #chatHeader .header-name {
      flex: 1;
      font-weight: 700;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 7%;
      position: relative;
      background-color: #efeae2;
      background-image:
        radial-gradient(circle at 15px 15px, rgba(0,0,0,.035) 1.5px, transparent 1.5px),
        radial-gradient(circle at 30px 30px, rgba(0,0,0,.025) 1px, transparent 1px);
      background-size: 45px 45px, 60px 60px;
    }

    .message-row {
      display: flex;
      margin-bottom: 6px;
    }

    .message-row.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(70%, 600px);
      padding: 8px 10px 7px;
      border-radius: 9px;
      box-shadow: 0 1px 1px rgba(0,0,0,.08);
      line-height: 1.4;
      word-wrap: break-word;
    }

    .me .bubble {
      background: var(--message-me);
      border-top-right-radius: 3px;
    }

    .you .bubble {
      background: var(--message-you);
      border-top-left-radius: 3px;
    }

    .message-time {
      display: block;
      color: #667781;
      font-size: 10px;
      text-align: right;
      margin-top: 3px;
    }

    .file-card {
      min-width: 200px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.04);
      margin-bottom: 4px;
    }

    .file-card a {
      color: #0b6b5b;
      text-decoration: none;
      font-weight: 700;
    }

    .image-message {
      max-width: 300px;
      max-height: 350px;
      display: block;
      border-radius: 9px;
      object-fit: cover;
    }

    .audio-player {
      width: 260px;
      max-width: 100%;
    }

    .chat-input-area {
      background: #f0f2f5;
      padding: 9px 12px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: transparent;
      color: #54656f;
      font-size: 21px;
      flex-shrink: 0;
    }

    .message-input-wrap {
      flex: 1;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 13px;
    }

    #messageInput {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      height: 44px;
    }

    .send-btn {
      background: var(--primary);
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 19px;
    }

    #mediaMenu {
      position: absolute;
      bottom: 70px;
      left: 15px;
      background: white;
      border-radius: 16px;
      padding: 8px;
      box-shadow: var(--shadow);
      width: 210px;
      z-index: 20;
    }

    .media-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 11px;
      background: white;
      border-radius: 9px;
    }

    .media-option:hover {
      background: #f0f2f5;
    }

    .media-option span:first-child {
      font-size: 20px;
    }

    #chatSettingsMenu {
      position: absolute;
      right: 15px;
      top: 57px;
      width: 220px;
      background: white;
      border-radius: 15px;
      box-shadow: var(--shadow);
      padding: 8px;
      z-index: 30;
    }

    .setting-btn {
      width: 100%;
      padding: 11px;
      text-align: left;
      border-radius: 9px;
      background: white;
    }

    .setting-btn:hover {
      background: #f2f4f5;
    }

    /* CALL WINDOW */

    #callOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    #callOverlay.active {
      display: flex;
    }

    .call-top {
      color: white;
      padding: 18px;
      text-align: center;
    }

    #remoteVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    #localVideo {
      position: absolute;
      right: 20px;
      top: 75px;
      width: 180px;
      max-width: 34vw;
      border-radius: 15px;
      border: 2px solid white;
      background: #222;
      z-index: 2;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    .call-controls {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 4;
    }

    .call-control {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      color: white;
      font-size: 21px;
    }

    .call-control.end {
      background: var(--danger);
    }

    #incomingCall {
      position: fixed;
      right: 20px;
      top: 20px;
      width: min(360px, calc(100% - 40px));
      background: #1f2c34;
      color: white;
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
      z-index: 200;
      display: none;
    }

    #incomingCall.show {
      display: block;
    }

    .incoming-actions {
      display: flex;
      gap: 9px;
      margin-top: 14px;
    }

    .incoming-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      color: white;
      font-weight: 700;
    }

    .answer-btn {
      background: #16a085;
    }

    .reject-btn {
      background: #c0392b;
    }

    /* BACKGROUNDS */

    .background-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .bg-option {
      height: 48px;
      border-radius: 9px;
      border: 2px solid transparent;
    }

    .bg-option:hover {
      border-color: var(--primary);
    }

    /* MOBILE */

    @media (max-width: 760px) {
      #sidebar {
        width: 100%;
        min-width: 0;
      }

      #chatArea {
        display: none;
      }

      #appScreen.chat-open #sidebar {
        display: none;
      }

      #appScreen.chat-open #chatArea {
        display: flex;
      }

      .mobile-back {
        display: block !important;
      }

      #messages {
        padding: 18px 4%;
      }

      .bubble {
        max-width: 85%;
      }
    }

    .mobile-back {
      display: none;
    }

    .video-disabled {
      background: #222;
    }

    .video-disabled::after {
      content: "Kamera kapalı";
      color: white;
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
  </style>
</head>

<body>

<!-- AUTH -->
<section id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">D</div>
      <h1>DorukCall</h1>
      <p>Arkadaşlarınla hızlı ve güvenli iletişim</p>
    </div>

    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="switchAuth('login')">Giriş Yap</button>
      <button id="registerTab" onclick="switchAuth('register')">Kayıt Ol</button>
    </div>

    <input id="usernameInput" class="input" type="text" placeholder="Kullanıcı adın">
    <input id="emailInput" class="input" type="email" placeholder="E-posta adresin">
    <input id="passwordInput" class="input" type="password" placeholder="Şifren">

    <button class="auth-btn" onclick="handleAuth()">Giriş Yap</button>

    <div id="authMessage" class="auth-msg"></div>
  </div>
</section>

<!-- APP -->
<section id="appScreen" class="hidden">

  <aside id="sidebar">

    <div class="sidebar-top">
      <div class="my-profile">
        <div class="avatar" id="myAvatar">D</div>
        <div class="profile-name" id="myName">Doruk</div>
        <button class="top-icon" title="Çıkış" onclick="logout()">⎋</button>
      </div>

      <div class="search-box">
        🔎
        <input id="searchUsers" placeholder="Kullanıcı ara..." oninput="filterUsers()">
      </div>
    </div>

    <div id="userList"></div>
  </aside>

  <main id="chatArea">

    <div id="welcome">
      <div>
        <div class="welcome-icon">💬</div>
        <h2>DorukCall</h2>
        <p>Soldan bir kişi seçerek sohbet etmeye başlayabilirsin.</p>
      </div>
    </div>

    <header id="chatHeader">
      <button class="circle-btn mobile-back" onclick="closeMobileChat()">‹</button>

      <div class="avatar" id="chatAvatar">D</div>

      <div class="header-name">
        <div id="chatUserName">Kullanıcı</div>
        <small id="chatUserStatus" style="color:#667781">çevrimdışı</small>
      </div>

      <button class="circle-btn" title="Sesli arama" onclick="startCall(false)">📞</button>
      <button class="circle-btn" title="Görüntülü arama" onclick="startCall(true)">📹</button>
      <button class="circle-btn" title="Ayarlar" onclick="toggleChatSettings()">⋮</button>
    </header>

    <div id="messages" class="hidden"></div>

    <div id="chatInputArea" class="chat-input-area">
      <button class="circle-btn" onclick="toggleMediaMenu()">＋</button>

      <div class="message-input-wrap">
        <input id="messageInput" placeholder="Mesaj yaz..." onkeydown="handleMessageKey(event)">
      </div>

      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <div id="mediaMenu" class="hidden">
      <button class="media-option" onclick="chooseFile('image/*')">
        <span>🖼️</span><span>Fotoğraf</span>
      </button>

      <button class="media-option" onclick="chooseFile('video/*')">
        <span>🎬</span><span>Video</span>
      </button>

      <button class="media-option" onclick="chooseFile('audio/*')">
        <span>🎵</span><span>Müzik / Ses</span>
      </button>

      <button class="media-option" onclick="chooseFile('*/*')">
        <span>📁</span><span>Dosya</span>
      </button>

      <button class="media-option" onclick="openCamera()">
        <span>📷</span><span>Kamera</span>
      </button>

      <button class="media-option" onclick="toggleRecording()">
        <span>🎙️</span><span id="recordText">Ses kaydı</span>
      </button>

      <input id="fileInput" type="file" class="hidden" onchange="uploadSelectedFile(this.files[0])">
    </div>

    <div id="chatSettingsMenu" class="hidden">
      <button class="setting-btn" onclick="showBackgroundPicker()">🎨 Sohbet arka planını değiştir</button>
      <button class="setting-btn" onclick="clearChatBackground()">↩ Varsayılan arka plan</button>

      <div id="backgroundPicker" class="hidden">
        <div class="background-grid">
          <button class="bg-option" style="background:#efeae2" onclick="setChatBackground('#efeae2')"></button>
          <button class="bg-option" style="background:#dcefff" onclick="setChatBackground('#dcefff')"></button>
          <button class="bg-option" style="background:#f6e2ff" onclick="setChatBackground('#f6e2ff')"></button>
          <button class="bg-option" style="background:#e2f7e7" onclick="setChatBackground('#e2f7e7')"></button>
          <button class="bg-option" style="background:#fff0d9" onclick="setChatBackground('#fff0d9')"></button>
          <button class="bg-option" style="background:#202b33" onclick="setChatBackground('#202b33')"></button>
          <button class="bg-option" style="background:linear-gradient(135deg,#8ec5fc,#e0c3fc)" onclick="setChatBackground('linear-gradient(135deg,#8ec5fc,#e0c3fc)')"></button>
          <button class="bg-option" style="background:linear-gradient(135deg,#43e97b,#38f9d7)" onclick="setChatBackground('linear-gradient(135deg,#43e97b,#38f9d7)')"></button>
        </div>
      </div>
    </div>

  </main>
</section>

<!-- CAMERA -->
<div id="cameraModal" class="hidden" style="
position:fixed;inset:0;background:#000;z-index:150;
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <video id="cameraVideo" autoplay playsinline style="max-width:100%;max-height:75vh;border-radius:18px"></video>

  <div style="margin-top:18px;display:flex;gap:12px">
    <button onclick="takePhoto()" style="background:#00a884;color:white;width:60px;height:60px;border-radius:50%;font-size:24px">📸</button>
    <button onclick="closeCamera()" style="background:#e53935;color:white;width:60px;height:60px;border-radius:50%;font-size:20px">✕</button>
  </div>
</div>

<!-- CALL -->
<div id="callOverlay">
  <div class="call-top">
    <strong id="callName">DorukCall</strong>
    <div id="callStatus">Bağlanıyor...</div>
  </div>

  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>

  <div class="call-controls">
    <button id="micCallBtn" class="call-control" onclick="toggleCallMic()">🎙️</button>
    <button id="camCallBtn" class="call-control" onclick="toggleCallCamera()">📹</button>
    <button class="call-control end" onclick="endCall()">📞</button>
  </div>
</div>

<!-- INCOMING CALL -->
<div id="incomingCall">
  <strong id="incomingName">Gelen arama</strong>
  <div id="incomingType" style="margin-top:5px;color:#cbd5d9">Görüntülü arama</div>

  <div class="incoming-actions">
    <button class="answer-btn" onclick="answerIncomingCall()">Cevapla</button>
    <button class="reject-btn" onclick="rejectIncomingCall()">Reddet</button>
  </div>
</div>

<script>
/* ============================================================
   SUPABASE
   ============================================================ */

const SUPABASE_URL = "https://xdpizbybmatsmzovrxqr.supabase.co";

/*
  BURAYA SUPABASE DASHBOARD'DAKİ
  sb_publishable_... ANAHTARINI KOY.
*/
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_XYAc2ayZ9s2HAGzJ0e2XFw_YKRi-tdO";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/* ============================================================
   GLOBAL
   ============================================================ */

let currentUser = null;
let currentProfile = null;
let selectedUser = null;

let profiles = [];
let messageChannel = null;
let callChannel = null;

let localStream = null;
let remoteStream = null;
let peerConnection = null;

let incomingOffer = null;
let incomingCaller = null;

let mediaRecorder = null;
let recordedChunks = [];
let recording = false;

let cameraStream = null;

/* ============================================================
   AUTH
   ============================================================ */

function switchAuth(type) {
  const login = type === "login";

  document.getElementById("loginTab").classList.toggle("active", login);
  document.getElementById("registerTab").classList.toggle("active", !login);

  document.getElementById("usernameInput").style.display = login ? "none" : "block";

  document.querySelector(".auth-btn").textContent =
    login ? "Giriş Yap" : "Hesap Oluştur";

  clearAuthMessage();
}

function setAuthMessage(text, error = false) {
  const el = document.getElementById("authMessage");
  el.textContent = text;
  el.style.color = error ? "#d32f2f" : "#008f72";
}

function clearAuthMessage() {
  document.getElementById("authMessage").textContent = "";
}

async function handleAuth() {
  const login = document.getElementById("loginTab").classList.contains("active");

  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;
  const username = document.getElementById("usernameInput").value.trim();

  if (!email || !password || (!login && !username)) {
    setAuthMessage("Lütfen gerekli alanları doldur.", true);
    return;
  }

  setAuthMessage("İşlem yapılıyor...");

  try {
    if (login) {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      setAuthMessage("Giriş başarılı.");
    } else {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            username
          }
        }
      });

      if (error) throw error;

      if (data.session) {
        await createProfile(data.user, username);
        setAuthMessage("Hesabın oluşturuldu.");
      } else {
        setAuthMessage(
          "Hesabın oluşturuldu. E-postandaki doğrulama bağlantısını aç."
        );
      }
    }
  } catch (error) {
    setAuthMessage(error.message || "Bir hata oluştu.", true);
  }
}

async function createProfile(user, username) {
  const { error } = await supabaseClient
    .from("profiles")
    .upsert({
      id: user.id,
      username: username || user.email.split("@")[0]
    });

  if (error) console.error(error);
}

async function logout() {
  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;
  selectedUser = null;

  location.reload();
}

/* ============================================================
   INIT
   ============================================================ */

async function init() {
  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    await startApp(session.user);
  }

  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (event === "SIGNED_IN" && session) {
      await startApp(session.user);
    }
  });
}

async function startApp(user) {
  currentUser = user;

  await ensureProfile();

  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");

  document.getElementById("myName").textContent =
    currentProfile?.username || user.email.split("@")[0];

  document.getElementById("myAvatar").textContent =
    (currentProfile?.username || "D")[0].toUpperCase();

  await loadUsers();
  subscribeToMessages();
  setupCallChannel();
}

async function ensureProfile() {
  let { data: profile } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (!profile) {
    await createProfile(
      currentUser,
      currentUser.user_metadata?.username ||
      currentUser.email.split("@")[0]
    );

    const result = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();

    profile = result.data;
  }

  currentProfile = profile;
}

/* ============================================================
   USERS
   ============================================================ */

async function loadUsers() {
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .neq("id", currentUser.id)
    .order("username", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  profiles = data || [];
  renderUsers(profiles);
}

function renderUsers(list) {
  const box = document.getElementById("userList");

  if (!list.length) {
    box.innerHTML = `
      <div style="padding:30px;text-align:center;color:#667781">
        Henüz başka kullanıcı yok.
      </div>
    `;
    return;
  }

  box.innerHTML = list.map(user => `
    <div class="user-item ${selectedUser?.id === user.id ? "active" : ""}"
         onclick="openChat('${user.id}')">

      <div class="avatar">
        ${escapeHtml((user.username || "D")[0].toUpperCase())}
      </div>

      <div class="user-info">
        <div class="user-name">${escapeHtml(user.username || "Kullanıcı")}</div>
        <div class="user-email">${escapeHtml(user.email || "")}</div>
      </div>
    </div>
  `).join("");
}

function filterUsers() {
  const q = document.getElementById("searchUsers").value.toLowerCase();

  renderUsers(
    profiles.filter(p =>
      (p.username || "").toLowerCase().includes(q) ||
      (p.email || "").toLowerCase().includes(q)
    )
  );
}

/* ============================================================
   CHAT
   ============================================================ */

async function openChat(userId) {
  selectedUser = profiles.find(p => p.id === userId);

  if (!selectedUser) return;

  document.getElementById("appScreen").classList.add("chat-open");

  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("chatHeader").style.display = "flex";
  document.getElementById("messages").classList.remove("hidden");
  document.getElementById("chatInputArea").style.display = "flex";

  document.getElementById("chatUserName").textContent =
    selectedUser.username || "Kullanıcı";

  document.getElementById("chatUserStatus").textContent =
    "DorukCall kullanıcısı";

  document.getElementById("chatAvatar").textContent =
    (selectedUser.username || "D")[0].toUpperCase();

  applySavedBackground();

  renderUsers(profiles);

  await loadMessages();

  document.getElementById("messageInput").focus();
}

function closeMobileChat() {
  document.getElementById("appScreen").classList.remove("chat-open");
}

async function loadMessages() {
  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  renderMessages(data || []);
}

function renderMessages(messages) {
  const box = document.getElementById("messages");

  box.innerHTML = messages.map(renderMessage).join("");

  box.scrollTop = box.scrollHeight;
}

function renderMessage(msg) {
  const me = msg.sender_id === currentUser.id;

  const time = new Date(msg.created_at).toLocaleTimeString("tr-TR", {
    hour: "2-digit",
    minute: "2-digit"
  });

  let content = "";

  if (msg.file_url) {
    const fileType = msg.file_type || "";

    if (fileType.startsWith("image/")) {
      content += `
        <a href="${escapeAttribute(msg.file_url)}" target="_blank">
          <img class="image-message"
               src="${escapeAttribute(msg.file_url)}"
               alt="Fotoğraf">
        </a>
      `;
    } else if (fileType.startsWith("audio/")) {
      content += `
        <audio class="audio-player"
               controls
               src="${escapeAttribute(msg.file_url)}"></audio>
      `;
    } else if (fileType.startsWith("video/")) {
      content += `
        <video controls
               style="max-width:300px;border-radius:10px"
               src="${escapeAttribute(msg.file_url)}"></video>
      `;
    } else {
      content += `
        <div class="file-card">
          📎
          <a href="${escapeAttribute(msg.file_url)}" target="_blank">
            ${escapeHtml(msg.file_name || "Dosya")}
          </a>
        </div>
      `;
    }
  }

  if (msg.content) {
    content += `<div>${escapeHtml(msg.content)}</div>`;
  }

  return `
    <div class="message-row ${me ? "me" : "you"}">
      <div class="bubble">
        ${content}
        <span class="message-time">${time}</span>
      </div>
    </div>
  `;
}

async function sendMessage() {
  if (!selectedUser) return;

  const input = document.getElementById("messageInput");
  const content = input.value.trim();

  if (!content) return;

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      sender_id: currentUser.id,
      receiver_id: selectedUser.id,
      content
    });

  if (error) {
    alert("Mesaj gönderilemedi: " + error.message);
    return;
  }

  input.value = "";
}

function handleMessageKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function subscribeToMessages() {
  if (messageChannel) {
    supabaseClient.removeChannel(messageChannel);
  }

  messageChannel = supabaseClient
    .channel("dorukcall-messages")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      async payload => {
        const msg = payload.new;

        const belongsToCurrentChat =
          selectedUser &&
          (
            (msg.sender_id === currentUser.id &&
              msg.receiver_id === selectedUser.id)
            ||
            (msg.sender_id === selectedUser.id &&
              msg.receiver_id === currentUser.id)
          );

        if (belongsToCurrentChat) {
          await loadMessages();
        }
      }
    )
    .subscribe();
}

/* ============================================================
   FILES
   ============================================================ */

function toggleMediaMenu() {
  document.getElementById("mediaMenu").classList.toggle("hidden");
}

function chooseFile(type) {
  const input = document.getElementById("fileInput");

  input.accept = type;
  input.click();
}

async function uploadSelectedFile(file) {
  if (!file || !selectedUser) return;

  document.getElementById("mediaMenu").classList.add("hidden");

  const path =
    currentUser.id +
    "/" +
    Date.now() +
    "_" +
    sanitizeFileName(file.name);

  const { error: uploadError } = await supabaseClient
    .storage
    .from("chat-files")
    .upload(path, file);

  if (uploadError) {
    alert("Dosya yüklenemedi: " + uploadError.message);
    return;
  }

  const { data } = supabaseClient
    .storage
    .from("chat-files")
    .getPublicUrl(path);

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      sender_id: currentUser.id,
      receiver_id: selectedUser.id,
      file_url: data.publicUrl,
      file_name: file.name,
      file_type: file.type
    });

  if (error) {
    alert("Dosya mesajı oluşturulamadı: " + error.message);
  }
}

/* ============================================================
   AUDIO RECORDING
   ============================================================ */

async function toggleRecording() {
  if (recording) {
    stopRecording();
    return;
  }

  if (!selectedUser) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    mediaRecorder = new MediaRecorder(stream);
    recordedChunks = [];
    recording = true;

    document.getElementById("recordText").textContent = "Kaydı durdur";

    mediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());

      const blob = new Blob(recordedChunks, {
        type: "audio/webm"
      });

      const file = new File(
        [blob],
        `ses-${Date.now()}.webm`,
        { type: "audio/webm" }
      );

      await uploadSelectedFile(file);

      recording = false;
      document.getElementById("recordText").textContent = "Ses kaydı";
    };

    mediaRecorder.start();

  } catch (error) {
    alert("Mikrofon kullanılamadı: " + error.message);
  }
}

function stopRecording() {
  if (mediaRecorder && recording) {
    mediaRecorder.stop();
  }
}

/* ============================================================
   CAMERA
   ============================================================ */

async function openCamera() {
  document.getElementById("mediaMenu").classList.add("hidden");

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    const video = document.getElementById("cameraVideo");
    video.srcObject = cameraStream;

    const modal = document.getElementById("cameraModal");
    modal.classList.remove("hidden");
    modal.style.display = "flex";

  } catch (error) {
    alert("Kamera açılamadı: " + error.message);
  }
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  const modal = document.getElementById("cameraModal");
  modal.classList.add("hidden");
  modal.style.display = "none";
}

async function takePhoto() {
  if (!cameraStream || !selectedUser) return;

  const video = document.getElementById("cameraVideo");

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  canvas.toBlob(async blob => {
    const file = new File(
      [blob],
      `kamera-${Date.now()}.jpg`,
      { type: "image/jpeg" }
    );

    closeCamera();

    await uploadSelectedFile(file);
  }, "image/jpeg", .92);
}

/* ============================================================
   CHAT BACKGROUND
   ============================================================ */

function toggleChatSettings() {
  document.getElementById("chatSettingsMenu")
    .classList.toggle("hidden");
}

function showBackgroundPicker() {
  document.getElementById("backgroundPicker")
    .classList.toggle("hidden");
}

function setChatBackground(background) {
  if (!selectedUser) return;

  localStorage.setItem(
    "dorukcall_bg_" + selectedUser.id,
    background
  );

  applySavedBackground();
}

function clearChatBackground() {
  if (!selectedUser) return;

  localStorage.removeItem(
    "dorukcall_bg_" + selectedUser.id
  );

  applySavedBackground();
}

function applySavedBackground() {
  if (!selectedUser) return;

  const background = localStorage.getItem(
    "dorukcall_bg_" + selectedUser.id
  );

  const messages = document.getElementById("messages");

  if (background) {
    messages.style.background = background;
    messages.style.backgroundImage = "none";
  } else {
    messages.style.backgroundColor = "#efeae2";
    messages.style.backgroundImage =
      "radial-gradient(circle at 15px 15px, rgba(0,0,0,.035) 1.5px, transparent 1.5px), radial-gradient(circle at 30px 30px, rgba(0,0,0,.025) 1px, transparent 1px)";
    messages.style.backgroundSize = "45px 45px,60px 60px";
  }

  document.getElementById("chatSettingsMenu").classList.add("hidden");
}

/* ============================================================
   WEBRTC CALLS
   ============================================================ */

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "stun:stun1.l.google.com:19302"
    }
  ]
};

function setupCallChannel() {
  if (callChannel) {
    supabaseClient.removeChannel(callChannel);
  }

  callChannel = supabaseClient
    .channel("dorukcall-call-signaling")

    .on(
      "broadcast",
      { event: "call-offer" },
      async ({ payload }) => {

        if (
          !currentUser ||
          payload.to !== currentUser.id
        ) return;

        incomingOffer = payload.offer;
        incomingCaller = payload.from;

        const callerProfile = profiles.find(
          p => p.id === payload.from
        );

        document.getElementById("incomingName").textContent =
          callerProfile?.username || "Bilinmeyen kullanıcı";

        document.getElementById("incomingType").textContent =
          payload.video ? "Görüntülü arama" : "Sesli arama";

        document.getElementById("incomingCall").classList.add("show");
      }
    )

    .on(
      "broadcast",
      { event: "call-answer" },
      async ({ payload }) => {

        if (payload.to !== currentUser.id) return;

        if (!peerConnection) return;

        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(payload.answer)
        );

        document.getElementById("callStatus").textContent =
          "Bağlandı";
      }
    )

    .on(
      "broadcast",
      { event: "call-ice" },
      async ({ payload }) => {

        if (
          payload.to !== currentUser.id ||
          !peerConnection ||
          !payload.candidate
        ) return;

        try {
          await peerConnection.addIceCandidate(
            new RTCIceCandidate(payload.candidate)
          );
        } catch (e) {
          console.error(e);
        }
      }
    )

    .on(
      "broadcast",
      { event: "call-hangup" },
      ({ payload }) => {

        if (payload.to !== currentUser.id) return;

        endCall(false);
      }
    )

    .subscribe();
}

async function createPeerConnection(targetId) {
  peerConnection = new RTCPeerConnection(rtcConfig);

  remoteStream = new MediaStream();

  document.getElementById("remoteVideo").srcObject =
    remoteStream;

  peerConnection.ontrack = event => {
    event.streams[0].getTracks().forEach(track => {
      remoteStream.addTrack(track);
    });
  };

  peerConnection.onicecandidate = async event => {
    if (!event.candidate) return;

    await callChannel.send({
      type: "broadcast",
      event: "call-ice",
      payload: {
        to: targetId,
        from: currentUser.id,
        candidate: event.candidate
      }
    });
  };

  return peerConnection;
}

async function startCall(videoEnabled) {
  if (!selectedUser) return;

  try {

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: videoEnabled
    });

    openCallOverlay(
      selectedUser.username || "Kullanıcı",
      videoEnabled
    );

    document.getElementById("localVideo").srcObject =
      localStream;

    if (!videoEnabled) {
      document.getElementById("localVideo").style.display =
        "none";
    } else {
      document.getElementById("localVideo").style.display =
        "block";
    }

    await createPeerConnection(selectedUser.id);

    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });

    const offer = await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    await callChannel.send({
      type: "broadcast",
      event: "call-offer",
      payload: {
        to: selectedUser.id,
        from: currentUser.id,
        offer,
        video: videoEnabled
      }
    });

    document.getElementById("callStatus").textContent =
      "Karşı tarafın cevap vermesi bekleniyor...";

  } catch (error) {
    console.error(error);
    alert("Arama başlatılamadı: " + error.message);
    endCall(false);
  }
}

async function answerIncomingCall() {
  if (!incomingOffer || !incomingCaller) return;

  try {

    const callerProfile = profiles.find(
      p => p.id === incomingCaller
    );

    let isVideo = document.getElementById("incomingType")
      .textContent
      .includes("Görüntülü");

    document.getElementById("incomingCall")
      .classList.remove("show");

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: isVideo
    });

    openCallOverlay(
      callerProfile?.username || "Kullanıcı",
      isVideo
    );

    document.getElementById("localVideo").srcObject =
      localStream;

    document.getElementById("localVideo").style.display =
      isVideo ? "block" : "none";

    await createPeerConnection(incomingCaller);

    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(incomingOffer)
    );

    const answer = await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    await callChannel.send({
      type: "broadcast",
      event: "call-answer",
      payload: {
        to: incomingCaller,
        from: currentUser.id,
        answer
      }
    });

    incomingOffer = null;
    incomingCaller = null;

    document.getElementById("callStatus").textContent =
      "Bağlandı";

  } catch (error) {
    console.error(error);
    alert("Arama kabul edilemedi: " + error.message);
    endCall(false);
  }
}

async function rejectIncomingCall() {
  if (incomingCaller) {
    await callChannel.send({
      type: "broadcast",
      event: "call-hangup",
      payload: {
        to: incomingCaller,
        from: currentUser.id
      }
    });
  }

  incomingOffer = null;
  incomingCaller = null;

  document.getElementById("incomingCall")
    .classList.remove("show");
}

function openCallOverlay(name, video) {
  document.getElementById("callOverlay").classList.add("active");

  document.getElementById("callName").textContent =
    name;

  document.getElementById("callStatus").textContent =
    "Bağlanıyor...";

  document.getElementById("camCallBtn").style.display =
    video ? "block" : "none";
}

async function endCall(sendSignal = true) {

  if (sendSignal && selectedUser) {
    await callChannel.send({
      type: "broadcast",
      event: "call-hangup",
      payload: {
        to: selectedUser.id,
        from: currentUser.id
      }
    });
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  if (remoteStream) {
    remoteStream.getTracks().forEach(track => track.stop());
    remoteStream = null;
  }

  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }

  document.getElementById("remoteVideo").srcObject = null;
  document.getElementById("localVideo").srcObject = null;

  document.getElementById("callOverlay").classList.remove("active");
}

function toggleCallMic() {
  if (!localStream) return;

  const track = localStream.getAudioTracks()[0];

  if (!track) return;

  track.enabled = !track.enabled;

  document.getElementById("micCallBtn").textContent =
    track.enabled ? "🎙️" : "🔇";
}

function toggleCallCamera() {
  if (!localStream) return;

  const track = localStream.getVideoTracks()[0];

  if (!track) return;

  track.enabled = !track.enabled;

  document.getElementById("camCallBtn").textContent =
    track.enabled ? "📹" : "🚫";
}

/* ============================================================
   HELPERS
   ============================================================ */

function sanitizeFileName(name) {
  return name
    .replace(/[^a-zA-Z0-9._-]/g, "_")
    .slice(0, 150);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

init();
